    <script>
        (function () {
            let li = document.querySelectorAll('.scrollbar li')
            let code = document.querySelector('.code')
            let free_vip = document.querySelector('.free-vip')
            li.forEach((item) => {
                item.addEventListener('mouseenter', (e) => {
                    if(parseInt(e.target.dataset.id) === 1){
                        free_vip.style.display = 'block'
                    }
                    if (parseInt(e.target.dataset.id) === 3) {
                        code.style.display = 'block'
                    }
                })
                item.addEventListener('mouseleave', (e) => {
                    if(parseInt(e.target.dataset.id) === 1){
                        free_vip.style.display = 'none'
                    }
                    if (parseInt(e.target.dataset.id) === 3) {
                        code.style.display = 'none'
                    }
                })
            })
        })();
        // 第一种轮播
        (function () {
            let i = 0
            let timer = 0
            let banners = document.querySelector('.banner')
            let img = document.querySelector('.banner img')
            let li = document.querySelectorAll('.banner li')
            let arr = [
                {
                    url: 'https://cdn.uuzixue.com/image/1720512604412-a8f04e01-7e23-9929-d7fd-902ba9e544da.jpg'
                },
                {
                    url: 'https://cdn.uuzixue.com/image/1698972579713-36891f4d-6436-2bd9-03ad-eeae00463fac.jpg'
                }
            ]
            function banner() {
                img.src = arr[i].url
                if (document.querySelector('.banner ul .active')) {
                    document.querySelector('.banner ul .active').classList.remove('active')
                }
                document.querySelector(`.banner ul li:nth-child(${i + 1})`).classList.add('active')
            }
            timer = setInterval(() => {
                i++
                if (i >= arr.length) {
                    i = 0
                }
                banner()
            }, 2000)
            li.forEach((item) => {
                item.addEventListener('mouseenter', (e) => {
                    i = parseInt(e.target.dataset.id)
                    banner()
                })
            })
            banners.addEventListener('mouseenter', () => {
                clearInterval(timer)
            })
            banners.addEventListener('mouseleave', () => {
                clearInterval(timer)
                timer = setInterval(() => {
                    i++
                    if (i >= arr.length) {
                        i = 0
                    }
                    banner()
                }, 2000)
            })
        })();
        // 第二种轮播

    </script>
